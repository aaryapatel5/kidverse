# ========================================================
# KidVerse Backend - Production Profile Configuration
# Activate in production: SPRING_PROFILES_ACTIVE=prod
# ========================================================

# Production schema validation (prevents accidental table drops or alters)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.kidverse=INFO
logging.level.org.hibernate.SQL=WARN

# In production, jwt.secret MUST be set via the JWT_SECRET environment variable.
# There is NO hardcoded secret in production.
jwt.secret=${JWT_SECRET:}

# In production, set CORS_ALLOWED_ORIGINS to your production frontend domain(s)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://kidverse.vercel.app}
