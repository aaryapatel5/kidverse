server.port=${PORT:8080}

# Default Active Spring Profile: 'dev' for safe local development; override with 'prod' in cloud deployments
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MySQL Database Configuration (Driven by environment variables with local defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/college_project?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Jackson JSON Configuration
spring.jackson.deserialization.fail-on-unknown-properties=false

# Logging Configuration
logging.level.com.kidverse=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}

# JWT Authentication Secret Key (Required via environment variable in production)
jwt.secret=${JWT_SECRET:}

# CORS Allowed Origins (Configurable via environment variable; comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
