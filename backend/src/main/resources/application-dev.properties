# ========================================================
# KidVerse Backend - Development Profile Configuration
# Active by default during local development (SPRING_PROFILES_ACTIVE=dev)
# ========================================================

# Development-specific DDL and SQL logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.kidverse=DEBUG

# Safe mock secret strictly for local developer testing (Minimum 32 characters for HMAC-SHA256)
# Overridden if environment variable JWT_SECRET is provided
jwt.secret=${JWT_SECRET:KidVerseLocalDevKeyForTestingOnly32CharsRequired!}

# Local development CORS origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
